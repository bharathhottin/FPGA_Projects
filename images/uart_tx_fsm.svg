<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" width="860" height="330" font-family="Segoe UI, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="860" height="330" rx="14" fill="#ffffff"/>
  <text x="430" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#0f172a">UART Transmitter State Machine</text>
  <text x="430" y="56" text-anchor="middle" font-size="13" fill="#64748b">115200 baud, 8N1 · 27 MHz / 115200 ≈ 234 clocks per bit</text>

  <!-- states -->
  <g font-size="15" font-weight="700" text-anchor="middle">
    <rect x="30"  y="140" width="130" height="58" rx="29" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
    <text x="95"  y="174" fill="#075985">IDLE</text>
    <rect x="200" y="140" width="130" height="58" rx="29" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="265" y="174" fill="#92400e">START BIT</text>
    <rect x="370" y="140" width="130" height="58" rx="29" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="435" y="174" fill="#166534">DATA BITS</text>
    <rect x="540" y="140" width="130" height="58" rx="29" fill="#fce7f3" stroke="#db2777" stroke-width="2"/>
    <text x="605" y="174" fill="#9d174d">STOP BIT</text>
    <rect x="710" y="140" width="130" height="58" rx="29" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
    <text x="775" y="174" fill="#5b21b6">CLEANUP</text>
  </g>

  <!-- forward arrows -->
  <g stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)">
    <line x1="160" y1="169" x2="198" y2="169"/>
    <line x1="330" y1="169" x2="368" y2="169"/>
    <line x1="500" y1="169" x2="538" y2="169"/>
    <line x1="670" y1="169" x2="708" y2="169"/>
    <!-- data self loop -->
    <path d="M415,198 C400,240 470,240 455,200"/>
    <!-- stop -> start : more chars -->
    <path d="M605,140 C590,80 280,80 265,138"/>
    <!-- cleanup -> idle -->
    <path d="M775,198 C760,300 75,300 62,198"/>
  </g>

  <!-- labels -->
  <g font-size="12" fill="#334155" text-anchor="middle">
    <text x="180" y="130">button</text>
    <text x="180" y="116">press</text>
    <text x="350" y="130">1 bit</text>
    <text x="350" y="116">after</text>
    <text x="520" y="130">8 bits</text>
    <text x="520" y="116">after</text>
    <text x="690" y="130">char</text>
    <text x="690" y="116">last</text>
    <text x="435" y="252">next bit (LSB first) ×8</text>
    <text x="435" y="90">more characters to send → next byte</text>
    <text x="435" y="292">frame complete → wait for next press</text>
  </g>

  <text x="118" y="222" text-anchor="middle" font-size="11" fill="#64748b">tx = 1</text>
  <text x="265" y="222" text-anchor="middle" font-size="11" fill="#64748b">tx = 0</text>
  <text x="605" y="222" text-anchor="middle" font-size="11" fill="#64748b">tx = 1</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
