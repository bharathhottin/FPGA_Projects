<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" width="860" height="330" font-family="Segoe UI, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs>
<rect width="860" height="330" rx="14" fill="#ffffff"/>
<text x="430.0" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#0f172a">Project 6 · UART Random Number Data Flow</text>
<text x="430.0" y="56" text-anchor="middle" font-size="13" font-weight="400" fill="#64748b">Each button press sends one pseudo-random byte to the PC as hex text</text>
<rect x="20" y="100" width="112" height="60" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
<text x="76.0" y="128.0" text-anchor="middle" font-size="12" font-weight="700" fill="#075985">Button</text>
<text x="76.0" y="141.0" text-anchor="middle" font-size="10" font-weight="400" fill="#075985">pin 3</text>
<rect x="162" y="100" width="112" height="60" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<text x="218.0" y="128.0" text-anchor="middle" font-size="12" font-weight="700" fill="#92400e">Edge detect</text>
<text x="218.0" y="141.0" text-anchor="middle" font-size="10" font-weight="400" fill="#92400e">1-clock pulse</text>
<rect x="304" y="100" width="112" height="60" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
<text x="360.0" y="128.0" text-anchor="middle" font-size="12" font-weight="700" fill="#5b21b6">8-bit LFSR</text>
<text x="360.0" y="141.0" text-anchor="middle" font-size="10" font-weight="400" fill="#5b21b6">num = lfsr</text>
<rect x="446" y="100" width="112" height="60" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<text x="502.0" y="128.0" text-anchor="middle" font-size="12" font-weight="700" fill="#92400e">Hex encoder</text>
<text x="502.0" y="141.0" text-anchor="middle" font-size="10" font-weight="400" fill="#92400e">2 chars + \n</text>
<rect x="588" y="100" width="112" height="60" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<text x="644.0" y="128.0" text-anchor="middle" font-size="12" font-weight="700" fill="#92400e">UART TX</text>
<text x="644.0" y="141.0" text-anchor="middle" font-size="10" font-weight="400" fill="#92400e">115200 8N1 · pin 17</text>
<rect x="730" y="100" width="112" height="60" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="786.0" y="128.0" text-anchor="middle" font-size="12" font-weight="700" fill="#166534">PC terminal</text>
<text x="786.0" y="141.0" text-anchor="middle" font-size="10" font-weight="400" fill="#166534">shows "B8"</text>
<path d="M132,130 H160" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
<path d="M274,130 H302" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
<path d="M416,130 H444" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
<path d="M558,130 H586" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
<path d="M700,130 H728" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
<text x="430" y="210" text-anchor="middle" font-size="12" font-weight="400" fill="#64748b">LFSR sequence after reset: each press shifts the register once</text>
<rect x="270" y="222" width="60" height="34" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
<text x="300" y="244" text-anchor="middle" font-size="14" font-weight="700" fill="#5b21b6" font-family="Consolas, Menlo, monospace">B8</text>
<path d="M330,239 H358" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
<rect x="360" y="222" width="60" height="34" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
<text x="390" y="244" text-anchor="middle" font-size="14" font-weight="700" fill="#5b21b6" font-family="Consolas, Menlo, monospace">5C</text>
<path d="M420,239 H448" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
<rect x="450" y="222" width="60" height="34" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
<text x="480" y="244" text-anchor="middle" font-size="14" font-weight="700" fill="#5b21b6" font-family="Consolas, Menlo, monospace">2E</text>
<path d="M510,239 H538" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
<rect x="540" y="222" width="60" height="34" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
<text x="570" y="244" text-anchor="middle" font-size="14" font-weight="700" fill="#5b21b6" font-family="Consolas, Menlo, monospace">…</text>
<text x="430" y="290" text-anchor="middle" font-size="12" font-weight="400" fill="#334155" font-family="Consolas, Menlo, monospace">Example: num = 0xB8 → '1011' = 'B' (0x42), '1000' = '8' (0x38), then '\n' (0x0A) → 3 UART frames</text>
<text x="430" y="314" text-anchor="middle" font-size="12" font-weight="400" fill="#64748b" font-family="Consolas, Menlo, monospace">lfsr ← { lfsr[0] ^ lfsr[1], lfsr[7:1] }</text>
