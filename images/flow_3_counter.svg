<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 320" width="860" height="320" font-family="Segoe UI, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs>
<rect width="860" height="320" rx="14" fill="#ffffff"/>
<text x="430.0" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#0f172a">Project 3 · 6-bit Binary Counter Flow</text>
<text x="430.0" y="56" text-anchor="middle" font-size="13" font-weight="400" fill="#64748b">Counts 0 → 63, then wraps to 0 · one step every 0.5 s</text>
<rect x="20" y="100" width="120" height="56" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="80.0" y="126.0" text-anchor="middle" font-size="13" font-weight="700" fill="#334155">Clock tick</text>
<text x="80.0" y="140.0" text-anchor="middle" font-size="11" font-weight="400" fill="#334155">27 MHz</text>
<rect x="170" y="100" width="160" height="56" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<text x="250.0" y="133.0" text-anchor="middle" font-size="13" font-weight="700" fill="#92400e">clockCounter + 1</text>
<polygon points="460,82.0 560.0,128 460,174.0 360.0,128" fill="#fce7f3" stroke="#db2777" stroke-width="2"/>
<text x="460" y="125.5" text-anchor="middle" font-size="12" font-weight="700" fill="#9d174d">clockCounter =</text>
<text x="460" y="140.5" text-anchor="middle" font-size="12" font-weight="700" fill="#9d174d">13,500,000?</text>
<rect x="600" y="100" width="140" height="56" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
<text x="670.0" y="126.0" text-anchor="middle" font-size="12" font-weight="700" fill="#5b21b6">clockCounter = 0</text>
<text x="670.0" y="139.0" text-anchor="middle" font-size="10" font-weight="400" fill="#5b21b6">ledCounter + 1</text>
<rect x="765" y="100" width="80" height="56" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="805.0" y="126.0" text-anchor="middle" font-size="12" font-weight="700" fill="#166534">6 LEDs</text>
<text x="805.0" y="139.0" text-anchor="middle" font-size="10" font-weight="400" fill="#166534">led = count</text>
<path d="M140,128 H168" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
<path d="M330,128 H358" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
<path d="M560,128 H598" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
<text x="579" y="120" text-anchor="middle" font-size="12" font-weight="600" fill="#334155">yes</text>
<path d="M740,128 H763" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
<path d="M460,174 V215 H80 V158" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
<text x="475" y="200" text-anchor="start" font-size="12" font-weight="600" fill="#334155">no</text>
<path d="M670,156 V240 H80 V215" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
<text x="430" y="285" text-anchor="middle" font-size="12" font-weight="400" fill="#64748b">Note: the count drives the LEDs directly, so on this active-low board a lit LED means a 0 bit.</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>